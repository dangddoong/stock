spring:
  application:
    name: inventory
  jackson:
    deserialization:
      fail-on-trailing-tokens: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${DB_USERNAME:inventory}
    password: ${DB_PASSWORD:inventory}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
      data-source-properties:
        # Sent at physical connection startup, not as SET queries on each request.
        options: "-c lock_timeout=${DB_LOCK_TIMEOUT_MS:3000} -c statement_timeout=${DB_STATEMENT_TIMEOUT_MS:5000}"
        connectTimeout: ${DB_CONNECT_TIMEOUT_SECONDS:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
